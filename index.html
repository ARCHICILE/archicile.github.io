<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHICILE · برنامج تسيير محلات الهواتف</title>
<meta name="description" content="ARCHICILE: برنامج كامل لتسيير محل الهواتف. البيع، المخزن بالكودبار وIMEI، ورشة التصليح، الزبائن والديون، العمال والإحصائيات، مع تطبيق للهاتف. Logiciel de gestion de magasin de téléphones.">
<meta property="og:title" content="ARCHICILE · برنامج تسيير محلات الهواتف">
<meta property="og:description" content="البيع، المخزن، ورشة التصليح، الديون والإحصائيات في برنامج واحد. تجربة مجانية 30 يومًا.">
<meta property="og:image" content="assets/screens/01_home.png">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14212B;--ink2:#0B141B;--muted:#5B6873;--line:#E3E8ED;--bg:#F5F7F9;--card:#fff;
  --blue:#0E5A8A;--blue2:#1679B8;--blueSoft:#E3EEF6;--orange:#F2A516;--orangeDark:#B45309;--green:#1F7A4D;--wa:#1FA855;
  --r:18px;--shadow:0 10px 30px rgba(20,33,43,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:12px;font-weight:800;font-size:16px;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;font-family:inherit;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--orange);color:var(--ink2);box-shadow:0 8px 22px rgba(242,165,22,.35)}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-wa{background:var(--wa);color:#fff}
.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}

/* ===== الشريط العلوي ===== */
header.nav{position:sticky;top:0;z-index:50;background:rgba(11,20,27,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.brand img{width:38px;height:38px;border-radius:9px;background:#fff;padding:3px}
.brand b{letter-spacing:3px;font-size:18px}
.brand b span{color:var(--orange)}
.nav nav{display:flex;gap:22px;margin-inline-start:18px}
.nav nav a{color:rgba(255,255,255,.75);font-weight:500;font-size:15px}
.nav nav a:hover{color:#fff}
.nav .sp{flex:1}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.lang button{background:none;border:0;color:rgba(255,255,255,.7);font:700 13px Tajawal,sans-serif;padding:6px 10px;border-radius:8px;cursor:pointer}
.lang button.on{background:#fff;color:var(--ink)}
.nav .btn{padding:9px 16px;font-size:14px}
.menu{display:none;background:none;border:0;color:#fff;cursor:pointer;padding:6px}
.menu svg{width:26px;height:26px}

/* ===== اللوحة الإعلانية ===== */
.promo{background:var(--ink2);padding:18px 0 0}
.slides{position:relative;border-radius:22px;overflow:hidden;min-height:170px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.slide{position:absolute;inset:0;display:flex;align-items:center;gap:24px;padding:28px 36px;color:#fff;opacity:0;transform:translateX(30px);transition:opacity .6s,transform .6s;pointer-events:none;background-size:cover;background-position:center}
[dir=rtl] .slide{transform:translateX(-30px)}
.slide.on{opacity:1;transform:none;pointer-events:auto;position:relative}
.slide.blue{background-image:linear-gradient(120deg,#0E5A8A,#1679B8 55%,#3BA0DB)}
.slide.dark{background-image:linear-gradient(120deg,#14212B,#23384A 60%,#0E5A8A)}
.slide.orange{background-image:linear-gradient(120deg,#B45309,#E08A0B 55%,#F2A516)}
.slide.green{background-image:linear-gradient(120deg,#13553A,#1F7A4D 60%,#2FA36A)}
.slide.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,20,27,.85),rgba(11,20,27,.35))}
[dir=rtl] .slide.img::before{background:linear-gradient(270deg,rgba(11,20,27,.85),rgba(11,20,27,.35))}
.slide>*{position:relative}
.slide .txt{flex:1}
.slide h3{margin:0 0 6px;font-size:28px;line-height:1.3;font-weight:800}
.slide p{margin:0;opacity:.9;font-size:17px;max-width:620px}
.slide .deco{width:110px;height:110px;flex:none;opacity:.9}
.dots{position:absolute;bottom:12px;inset-inline-start:36px;display:flex;gap:7px;z-index:3}
.dots button{width:9px;height:9px;border-radius:9px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0;transition:width .3s}
.dots button.on{width:26px;background:#fff}

/* ===== الواجهة ===== */
.hero{background:radial-gradient(1200px 500px at 80% -10%,rgba(22,121,184,.35),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(242,165,22,.12),transparent 60%),var(--ink2);color:#fff;padding:56px 0 90px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(242,165,22,.14);color:var(--orange);border:1px solid rgba(242,165,22,.35);padding:6px 12px;border-radius:30px;font-weight:700;font-size:14px}
.hero h1{font-size:46px;line-height:1.2;margin:18px 0 14px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p.lead{font-size:19px;color:rgba(255,255,255,.78);margin:0 0 26px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .note{margin-top:16px;color:rgba(255,255,255,.55);font-size:14px}
.devices{position:relative}
.laptop{background:#1d2a35;border-radius:16px 16px 6px 6px;padding:12px 12px 0;box-shadow:0 40px 80px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.laptop .scr{border-radius:6px;overflow:hidden;aspect-ratio:1600/950;background:#fff}
.laptop .scr img{width:100%;height:100%;object-fit:cover;object-position:top}
.laptop::after{content:"";display:block;height:14px;margin:0 -40px;background:linear-gradient(#3a4a57,#22303b);border-radius:0 0 18px 18px}
.phone{position:absolute;bottom:-38px;inset-inline-start:-26px;width:150px;aspect-ratio:9/19;background:#0b141b;border-radius:26px;padding:7px;border:2px solid #34444f;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.phone .in{width:100%;height:100%;border-radius:20px;overflow:hidden;background:#F3F5F7;color:var(--ink);font-size:9px;display:flex;flex-direction:column}
.phone .bar{background:var(--ink);color:#fff;padding:12px 9px 8px;font-weight:800;font-size:10px}
.phone .row{background:#fff;margin:5px 6px 0;border-radius:7px;padding:6px 7px;display:flex;justify-content:space-between;gap:4px;border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.phone .row span{overflow:hidden;text-overflow:ellipsis}
.phone .row b{font-weight:800}
.phone .pay{margin:auto 6px 8px;background:var(--blue);color:#fff;text-align:center;border-radius:8px;padding:8px;font-weight:800;font-size:10px}

/* ===== الأرقام ===== */
.facts{margin-top:-46px;position:relative;z-index:2}
.facts .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fact{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.fact .ic{width:46px;height:46px;border-radius:12px;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;flex:none}
.fact .ic svg{width:24px;height:24px}
.fact b{display:block;font-size:20px;font-weight:800}
.fact span{color:var(--muted);font-size:14px}

section{padding:80px 0}
.head{text-align:center;max-width:720px;margin:0 auto 42px}
.head .k{color:var(--blue);font-weight:800;letter-spacing:1px;font-size:14px}
.head h2{font-size:36px;margin:6px 0 10px;line-height:1.25}
.head p{color:var(--muted);font-size:17px;margin:0}

/* ===== المميزات ===== */
.feats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:transform .2s,box-shadow .2s}
.feat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.feat .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;color:#fff}
.feat .ic svg{width:24px;height:24px}
.feat h3{margin:0 0 6px;font-size:18px}
.feat p{margin:0;color:var(--muted);font-size:15px}

/* ===== الصور ===== */
.shots{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tabs button{background:var(--bg);border:1px solid var(--line);border-radius:30px;padding:9px 18px;font:700 15px Tajawal,sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.shot{max-width:1000px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(20,33,43,.18);border:1px solid var(--line);cursor:zoom-in;background:#fff}
.shot img{width:100%;aspect-ratio:1600/950;object-fit:cover;object-position:top}
.shot-cap{text-align:center;color:var(--muted);margin-top:16px}

/* ===== الفيديوهات ===== */
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vid{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.vid .media{position:relative;aspect-ratio:16/9;background:#0b141b;cursor:pointer}
.vid .media.v{aspect-ratio:9/16;max-height:520px;margin:0 auto}
.vid .media img{width:100%;height:100%;object-fit:cover;opacity:.85}
.vid .media iframe,.vid .media video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play span{width:68px;height:68px;border-radius:50%;background:rgba(242,165,22,.95);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .2s}
.vid .media:hover .play span{transform:scale(1.08)}
.vid .play svg{width:28px;height:28px;color:var(--ink2);margin-inline-start:4px}
[dir=rtl] .vid .play svg{margin-inline-start:0;margin-inline-end:4px;transform:scaleX(-1)}
.vid .t{padding:14px 16px;font-weight:800}
.vid .t small{display:block;color:var(--muted);font-weight:500}
.novid{text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:40px}

/* ===== التطبيقات ===== */
.apps{background:var(--ink2);color:#fff}
.apps .head h2{color:#fff}.apps .head p{color:rgba(255,255,255,.7)}.apps .head .k{color:var(--orange)}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.app{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:24px}
.app .ic{width:52px;height:52px;border-radius:14px;background:rgba(242,165,22,.15);color:var(--orange);display:grid;place-items:center;margin-bottom:14px}
.app .ic svg{width:26px;height:26px}
.app h3{margin:0 0 6px}
.app p{margin:0;color:rgba(255,255,255,.7)}

/* ===== الخطوات ===== */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-16px;inset-inline-start:22px;width:36px;height:36px;border-radius:50%;background:var(--orange);color:var(--ink2);font-weight:800;display:grid;place-items:center;font-size:18px}
.step h3{margin:8px 0 6px}
.step p{margin:0;color:var(--muted)}

/* ===== الأسئلة ===== */
.faq{max-width:820px;margin:0 auto}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 20px}
summary{cursor:pointer;font-weight:800;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--blue);font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin:0 0 16px;color:var(--muted)}

/* ===== الاتصال ===== */
/* ===== الأسعار ===== */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.pl{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;display:flex;flex-direction:column}
.pl.max{background:var(--ink2);color:#fff;border:2px solid var(--orange);box-shadow:0 30px 60px rgba(11,20,27,.25);transform:translateY(-8px)}
.pl .best{position:absolute;top:-14px;inset-inline-start:24px;background:var(--orange);color:var(--ink2);font-weight:800;font-size:13px;padding:4px 14px;border-radius:20px}
.pn{font-size:22px;font-weight:800;letter-spacing:.5px}
.pn em{font-style:normal;color:var(--blue)}
.pl.max .pn em{color:var(--orange)}
.ps{color:var(--muted);font-size:14px;margin-top:2px;min-height:42px}
.pl.max .ps{color:rgba(255,255,255,.65)}
.pp{margin:14px 0 6px}
.pp b{font-size:40px;font-weight:800;line-height:1}
.pp small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.pl.max .pp small{color:rgba(255,255,255,.65)}
.pl ul{list-style:none;padding:0;margin:12px 0 0;flex:1}
.pl li{padding:6px 0;display:flex;gap:8px;font-size:15px;border-top:1px dashed var(--line)}
.pl.max li{border-color:rgba(255,255,255,.12)}
.pl li::before{content:"✓";color:var(--green);font-weight:800}
.pl.max li::before{color:var(--orange)}
.pl li.plus{font-weight:800}
.pl li.plus::before{content:"+"}
.pnote{margin-top:14px;background:rgba(242,165,22,.12);border:1px solid rgba(242,165,22,.35);color:#FFD27A;border-radius:12px;padding:10px 12px;font-size:13px}
.ptrial{text-align:center;margin:26px auto 0;max-width:640px;font-weight:700;color:var(--blue);font-size:17px}
@media (max-width:980px){.plans{grid-template-columns:1fr}.pl.max{transform:none}}

/* ===== التحميل ===== */
.req{display:inline-block;margin-top:12px !important;background:var(--blueSoft);color:var(--blue);font-weight:800;padding:8px 16px;border-radius:30px;font-size:15px}
.dl{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:start}
.dlc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;position:relative}
.dlc.main{border:2px solid var(--orange);box-shadow:0 20px 50px rgba(242,165,22,.15)}
.dlc .rec{position:absolute;top:-13px;inset-inline-start:24px;background:var(--orange);color:var(--ink2);font-weight:800;font-size:13px;padding:4px 12px;border-radius:20px}
.dlc h3{margin:4px 0 6px;font-size:22px}
.dlc .sub{color:var(--muted);margin:0 0 16px}
.dlc ul{list-style:none;padding:0;margin:0 0 20px}
.dlc li{padding:5px 0;display:flex;gap:8px}
.dlc li::before{content:"✓";color:var(--green);font-weight:800}
.dlc .btn{width:100%;justify-content:center}
.dlc .meta{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
.how{margin-top:20px;border-top:1px dashed var(--line);padding-top:18px}
.how b{display:block;margin-bottom:10px}
.how ol{margin:0 0 14px;padding-inline-start:20px;color:var(--muted)}
.how ol li{display:list-item;padding:3px 0}
.how ol li::before{content:none}
.how em{font-style:normal;color:var(--ink);font-weight:700}
.ss{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ssw{background:#0067B8;color:#fff;border-radius:6px;padding:14px;font-family:"Segoe UI",Tahoma,sans-serif;font-size:11px;min-height:150px;display:flex;flex-direction:column;position:relative}
.ssw h4{margin:0 0 6px;font-size:14px;font-weight:600}
.ssw p{margin:0;opacity:.9;line-height:1.4}
.ssw .lnk{margin-top:6px;text-decoration:underline;font-weight:700;outline:2px solid var(--orange);outline-offset:2px;border-radius:2px;width:max-content}
.ssw .btns{margin-top:auto;display:flex;gap:6px;justify-content:flex-end}
.ssw .btns span{border:1px solid rgba(255,255,255,.8);padding:4px 10px;font-size:10px}
.ssw .btns .hl{outline:2px solid var(--orange);outline-offset:2px;background:rgba(255,255,255,.15);font-weight:700}
.ssw .n{position:absolute;top:-10px;inset-inline-end:-10px;width:26px;height:26px;border-radius:50%;background:var(--orange);color:var(--ink2);font-weight:800;display:grid;place-items:center;font-size:14px;font-family:Tajawal,sans-serif}
@media (max-width:980px){.dl{grid-template-columns:1fr}}
@media (max-width:620px){.ss{grid-template-columns:1fr}}

.contact{padding:0 0 80px}
.cbox{background:linear-gradient(120deg,var(--blue),var(--blue2));border-radius:26px;padding:44px;color:#fff;display:flex;align-items:center;gap:30px;flex-wrap:wrap;box-shadow:0 30px 60px rgba(14,90,138,.3)}
.cbox h2{margin:0 0 6px;font-size:32px}
.cbox p{margin:0;opacity:.85;font-size:17px}
.cbox .txt{flex:1;min-width:260px}
.cbox .cta{display:flex;gap:10px;flex-wrap:wrap}
footer{background:var(--ink2);color:rgba(255,255,255,.6);padding:30px 0;font-size:14px}
footer .wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
footer a:hover{color:#fff}
footer .sp{flex:1}

/* صورة مكبّرة */
.lb{position:fixed;inset:0;background:rgba(5,10,14,.92);z-index:100;display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-height:92vh;border-radius:10px}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}

@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr}
  .hero h1{font-size:36px}
  .devices{margin:10px 20px 30px}
  .facts .grid,.feats{grid-template-columns:repeat(2,1fr)}
  .vids,.appgrid,.steps{grid-template-columns:1fr 1fr}
  .nav nav{display:none}
  .nav nav.open{display:flex;position:absolute;top:68px;inset-inline:0;flex-direction:column;background:var(--ink2);padding:16px 20px;gap:14px}
  .menu{display:block}
}
@media (max-width:620px){
  .wrap{padding:0 16px}
  .nav .btn{display:none}
  .slide{padding:22px 20px 34px;flex-direction:column;align-items:flex-start;gap:12px}
  .slide .deco{display:none}
  .slide h3{font-size:22px}
  .dots{inset-inline-start:20px}
  .hero{padding:40px 0 80px}
  .hero h1{font-size:30px}
  .phone{width:120px;inset-inline-start:-10px;bottom:-28px}
  .phone .in{font-size:8px}
  .phone .pay{font-size:8px;padding:6px}
  .facts .grid,.feats,.vids,.appgrid,.steps{grid-template-columns:1fr}
  section{padding:60px 0}
  .head h2{font-size:28px}
  .cbox{padding:28px}
  .cbox h2{font-size:26px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top"><img src="assets/logo.png" alt=""><b>ARCHI<span>CILE</span></b></a>
    <nav id="menu">
      <a href="#features" data-t="nav_features"></a>
      <a href="#screens" data-t="nav_screens"></a>
      <a href="#videos" data-t="nav_videos"></a>
      <a href="#apps" data-t="nav_apps"></a>
      <a href="#pricing" data-t="nav_pricing"></a>
      <a href="#faq" data-t="nav_faq"></a>
    </nav>
    <div class="sp"></div>
    <div class="lang"><button data-l="ar">العربية</button><button data-l="fr">FR</button></div>
    <a class="btn btn-primary" href="#download"><span data-t="download"></span></a>
    <button class="menu" aria-label="menu" onclick="document.getElementById('menu').classList.toggle('open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
</header>

<!-- اللوحة الإعلانية -->
<div class="promo" id="top">

let lang = 'ar', site = null, slide = 0, timer = null;
try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || 'ar'; } catch (e) {}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function link(k){
  if (!site) return '#';
  if (k === 'store') return site.store;
  if (k === 'whatsapp') return 'https://wa.me/' + site.whatsapp;
  if (k === 'facebook') return site.facebook;
  return k || '#';
}

function apply(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'ARCHICILE · برنامج تسيير محلات الهواتف' : 'ARCHICILE · Logiciel de gestion de magasin de téléphones';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t[el.dataset.t]; if (v == null) return;
    if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.getElementById('feats').innerHTML = t.feats.map(f =>
    `<div class="feat reveal"><div class="ic" style="background:${f[2]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[f[3]]}</svg></div><h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></div>`).join('');
  document.getElementById('faqList').innerHTML = t.faq.map((q, i) => `<details${i ? '' : ' open'}><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('');
  for (const k of ['pl1', 'pl2', 'pl3']) document.getElementById(k).innerHTML = t[k].map(x => x.startsWith('+') ? `<li class="plus">${esc(x.slice(1))}</li>` : `<li>${esc(x)}</li>`).join('');
  document.getElementById('tabs').innerHTML = t.shots.map((s, i) => `<button data-i="${i}">${esc(s[1])}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => shot(+b.dataset.i));
  shot(0);
  document.getElementById('heroShot').src = 'assets/screens/' + (lang === 'fr' ? '15_home_fr' : '01_home') + '.png';
  renderBanners(); renderVideos(); observe();
}

function shot(i){
  const s = T[lang].shots[i];
  document.getElementById('shotImg').src = 'assets/screens/' + s[0] + '.png';
  document.getElementById('shotCap').textContent = s[1];
  document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
}
function openLb(src){ document.getElementById('lbImg').src = src; document.getElementById('lb').classList.add('on'); }

// ===== اللوحة الإعلانية =====
function renderBanners(){
  const box = document.getElementById('slides');
  const list = (site && site.banners || []).filter(b => b[lang] && b[lang].title);
  box.querySelectorAll('.slide').forEach(s => s.remove());
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  box.parentElement.parentElement.style.display = list.length ? '' : 'none';
  list.forEach((b, i) => {
    const c = b[lang];
    const el = document.createElement(b.link ? 'a' : 'div');
    el.className = 'slide ' + (b.image ? 'img' : (b.color || 'blue'));
    if (b.image) el.style.backgroundImage = `url("${b.image.replace(/"/g, '')}")`;
    if (b.link) { el.href = link(b.link); el.target = '_blank'; el.rel = 'noopener'; }
    el.innerHTML = `<div class="txt"><h3>${esc(c.title)}</h3>${c.text ? `<p>${esc(c.text)}</p>` : ''}</div>` +
      (c.button ? `<span class="btn ${b.color === 'orange' && !b.image ? 'btn-light' : 'btn-primary'}">${esc(c.button)}</span>` : '') +
      (b.image ? '' : `<svg class="deco" viewBox="0 0 100 100" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5"><rect x="22" y="10" width="56" height="80" rx="9"/><path d="M42 80h16"/><path d="M34 34h32M34 46h32M34 58h20" stroke="rgba(255,255,255,.6)"/></svg>`);
    box.insertBefore(el, dots);
    const d = document.createElement('button');
    d.setAttribute('aria-label', String(i + 1));
    d.onclick = () => go(i, true);
    dots.appendChild(d);
  });
  dots.style.display = list.length > 1 ? '' : 'none';
  slide = 0; go(0);
}
function go(i, user){
  const s = document.querySelectorAll('#slides .slide'), d = document.querySelectorAll('#dots button');
  if (!s.length) return;
  slide = (i + s.length) % s.length;
  s.forEach((x, j) => x.classList.toggle('on', j === slide));
  d.forEach((x, j) => x.classList.toggle('on', j === slide));
  clearInterval(timer);
  if (s.length > 1) timer = setInterval(() => go(slide + 1), user ? 9000 : 6000);
}

// ===== الفيديوهات =====
function renderVideos(){
  const box = document.getElementById('vids');
  const list = (site && site.videos || []).map(v => ({ ...v, p: ArchiVideo.parse(v.url) })).filter(v => v.p);
  if (!list.length) { box.style.display = 'block'; box.innerHTML = `<div class="novid">${esc(T[lang].vid_none)}</div>`; return; }
  box.style.display = '';
  box.innerHTML = list.map((v, i) => {
    const title = (v[lang] && v[lang].title) || (v.ar && v.ar.title) || (v.fr && v.fr.title) || '';
    const sub = (v[lang] && v[lang].text) || '';
    const thumb = v.p.thumb || v.thumb || '';
    return `<div class="vid reveal"><div class="media${v.p.vertical ? ' v' : ''}" data-i="${i}">` +
      (v.p.kind === 'file' ? `<video controls preload="metadata" src="${esc(v.p.src)}"></video>` :
        (thumb ? `<img loading="lazy" src="${esc(thumb)}" alt="">` : '') + `<div class="play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></span></div>`) +
      `</div>${title ? `<div class="t">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>` : ''}</div>`;
  }).join('');
  box.querySelectorAll('.media[data-i]').forEach(m => {
    const v = list[+m.dataset.i];
    if (v.p.kind === 'file') return;
    m.onclick = () => { m.innerHTML = `<iframe src="${v.p.embed}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; m.onclick = null; };
  });
}

// ===== الظهور عند النزول =====
let io;
function observe(){
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.reveal').forEach(e => e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll('.reveal:not(.in)').forEach(e => io.observe(e));
}

function links(){
  document.querySelectorAll('.js-store').forEach(a => a.href = link('store'));
  document.querySelectorAll('.js-wa').forEach(a => a.href = link('whatsapp'));

  document.querySelectorAll('.js-direct').forEach(a => a.href = site.direct);
}

const STATS = 'https://uttuyvvixmpibroskjgl.supabase.co/rest/v1/rpc/site_hit';

function hit(kind, target){
  if (draft) return; // معاينة صفحة الإدارة لا تُحسب
  let ref = '';
  try { const r = document.referrer ? new URL(document.referrer).hostname : ''; ref = r === location.hostname ? '' : r.replace(/^www\./, ''); } catch (e) {}
  const body = JSON.stringify({ p_kind: kind, p_target: target || null, p_page: location.pathname, p_ref: ref,
    p_device: matchMedia('(max-width: 760px)').matches ? 'mobile' : 'desktop', p_lang: lang });
  try { fetch(STATS, { method: 'POST', keepalive: true, headers: { apikey: STATS_KEY, 'Content-Type': 'application/json' }, body }); } catch (e) {}
}
